name: droidian starlte builder

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

env:
  CONTAINER_IMAGE: quay.io/droidian/rootfs-builder:bookworm-amd64

jobs:
  once:
    runs-on: ubuntu-22.04
    name: Generate matrix
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pyyaml
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Generate matrix
        id: gen-matrix
        run: |
          JOBS="$(./generate_device_recipe.py --matrix)"
          echo "matrix=${JOBS}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-22.04
    needs: once
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}
    name: ${{ matrix.config.job_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Patch dead upstream dependencies
        run: |
          cat > /tmp/patch.py <<'PYEOF'
          import re

          p = 'rootfs-templates/scripts/install-adaptation.sh'
          s = open(p).read()
          s = re.sub(r'^.*repo\.bardia\.tech.*\n', '', s, flags=re.M)
          s = s.replace('systemctl disable systemd-resolved', 'systemctl disable systemd-resolved || true')
          s = s.replace('systemctl mask systemd-resolved', 'systemctl mask systemd-resolved || true')
          open(p, 'w').write(s)
          print('patched install-adaptation.sh')

          p = 'rootfs-templates/scripts/genimage.sh'
          s = open(p).read()
          old = "\n".join([
              "apt update",
              "apt install wget -y",
              "wget https://github.com/Sexynos/droidian-kernel-samsung-exynos9810/releases/download/starlte/boot-starlte.img",
              "cp ./boot-starlte.img ${WORK_DIR}/target/data/boot.img",
          ])
          new = "cp \"$(find ${ROOTFS_PATH}/boot -maxdepth 1 -name 'boot.img-*' | head -n1)\" ${WORK_DIR}/target/data/boot.img"
          if old not in s:
              raise SystemExit('ERROR: expected genimage.sh block not found')
          open(p, 'w').write(s.replace(old, new))
          print('patched genimage.sh')
          PYEOF
          python3 /tmp/patch.py

      - name: QEMU set-up
        uses: docker/setup-qemu-action@v3

      - name: Create build dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull container
        run: docker pull ${CONTAINER_IMAGE}

      - name: Start container
        run: |
          CONTAINER_HASH=$(docker run --detach --privileged --cgroupns=host \
            --tmpfs /run \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            ${CONTAINER_IMAGE} /sbin/init)
          echo "CONTAINER_HASH=${CONTAINER_HASH}" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec "${CONTAINER_HASH}" test -S /run/dbus/system_bus_socket 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec "${CONTAINER_HASH}" systemctl is-system-running || true

      - name: Build image
        run: |
          docker exec $CONTAINER_HASH /bin/sh -c 'cd /buildd/sources; DROIDIAN_VERSION=nightly ./generate_device_recipe.py ${{ matrix.config.product }} ${{ matrix.config.arch }} ${{ matrix.config.edition }} ${{ matrix.config.variant }} ${{ matrix.config.apilevel }} && debos --disable-fakemachine generated/droidian.yaml'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidian-${{ matrix.config.product }}-${{ matrix.config.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    runs-on: ubuntu-22.04
    needs: build
    name: Publish release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: droidian-out
          merge-multiple: true

      - name: Show artifacts
        run: ls -lR droidian-out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "starlte-build-${{ github.run_number }}" \
            --title "Droidian starlte build ${{ github.run_number }}" \
            --notes "Auto-built Droidian (rootfs + exynos9810 adaptation) for Samsung Galaxy S9 (starlte). Flash via flash_all.sh from the zip." \
            droidian-out/*
